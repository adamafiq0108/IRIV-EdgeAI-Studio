# Installed by scripts/install.sh into /etc/NetworkManager/conf.d/.
#
# A WIRED PORT WITH NOBODY HANDING OUT ADDRESSES.
#
# The default wired profile is DHCP, and DHCP needs a server. A cable straight
# from one iriv into another, or from an iriv into a laptop, has none -- and
# NetworkManager's default answer to that is NO address: it asks for a lease,
# gives up after 45 s, marks the port failed and asks again, for ever. The
# laptop on the other end meanwhile gives itself 169.254.x.y (every Windows
# and Mac does) and waits for a neighbour that never appears. Customer UAT
# 2026-10-04: "iriv -> iriv direct: fail".
#
# "fallback" (NetworkManager 1.52 and later) is the laptop's behaviour: a
# link-local address when DHCP yields nothing, dropped again the moment a
# lease arrives. The port then has an address the panel can show and
# iriv.local can answer on, and two boxes on one cable can see each other.
#
# A connection DEFAULT, not a profile edit: it reaches every wired profile
# that leaves ipv4.link-local at "default" -- NetworkManager's own "Wired
# connection N" and the ones the Network page writes -- without touching any
# of them, and a profile set explicitly still wins. The hotspot (method
# shared) and a fixed address already have an address, so nothing changes
# for them.
[connection]
ipv4.link-local=fallback
