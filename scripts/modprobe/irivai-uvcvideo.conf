# USB camera driver settings for the IRIV Edge AI.
#
# MEASURED on a box running an Arducam B0499, whose only mode is uncompressed
# YUYV 1456x1088 at 44fps -- 3.1 MB a frame, 139 MB/s on the wire. With the
# stock settings the picture froze for ten and a half seconds at a time, every
# twenty seconds or so, while the camera itself was perfectly healthy: opened
# on its own it ran forty seconds at 43.4 fps with a 23ms worst gap.
#
#   timeout=1500
#     How long uvcvideo waits for the stream before giving up on it. The
#     default is 5000ms, and the app's own recovery cannot run while the
#     capture thread is blocked inside that wait -- so every hiccup became a
#     ten-second freeze (two timeouts), no matter how quickly the app was
#     willing to reopen. Short enough that a stall is a blink; long enough
#     that a camera merely being slow is not treated as one.
#
#   nodrop=0
#     Drop frames the driver knows are corrupt instead of passing them on.
#     This is the kernel default; it is written down because the opposite was
#     set on a box in the field, and a bandwidth-starved uncompressed stream
#     is exactly where "keep the broken frames" turns a recoverable stall into
#     visible garbage.
#
# Together with the app-side settings in systems/*/app/camera.py (more V4L2
# buffers and a shorter stall bar for big uncompressed cameras) this took the
# same feed from 6.8 new frames a second with 10.9s freezes to 24.3 with a
# 144ms worst gap, over ninety seconds with no reopens at all.
#
# Install: sudo cp scripts/modprobe/irivai-uvcvideo.conf /etc/modprobe.d/
#          sudo modprobe -r uvcvideo && sudo modprobe uvcvideo
#          (or reboot -- the settings apply when the module loads)
options uvcvideo timeout=1500 nodrop=0
