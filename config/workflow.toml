# Workflow editor policy.
#
# Committed on purpose: these are product defaults, the same on every box.
# Anything a single deployment changes goes in workflow.local.toml, which is
# gitignored and only writable with shell access to the board.

[python]
# May a Python Function node's code be written from the browser and run in the
# detection loop?
#
# OFF by default, and deliberately not switchable from the web UI. Turning it
# on means an account can execute arbitrary Python on this box, so it must
# cost what it should cost: shell access. Editing the code additionally
# requires the MASTER tier (core/services/auth.py), so an admin -- or a stolen
# admin session -- cannot reach it.
#
# Template code shipped with a template is a different path
# (systems/demo/app/extensions.py) and is unaffected by this flag.
enabled = false
