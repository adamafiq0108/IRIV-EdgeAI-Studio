# Over-the-air platform updates.
#
# Where a box looks for new releases of the PRODUCT itself (not templates --
# that is store.toml). Releases are published to a private repo as a signed
# bundle; a box reads them with a read-only fine-grained token it keeps in
# config/update.local.toml, which never appears here or in git.
#
# Committed file: product facts and defaults. Anything machine-written lives
# in update.local.toml beside it.

[release]
# Two channels, each in a release repo of its OWN, told apart by the tag too:
#
#   v2.1.3        customer release -- what every appliance is offered,
#                 published to `repo`
#   v2.1.3-dev    developer release -- the build carrying core/dev, scripts/dev
#                 and the owner frontend, published to `dev_repo`
#
# A box only ever looks at its own channel's repo and tags. The developer
# channel is offered only where BOTH locks are open: the account carries the
# developer flag (which the web UI refuses to grant -- see
# core/services/auth.py) and the box is declared a dev box in deploy.toml
# (which no API writes). An admin who invents a role called "dev" gets a
# display label and nothing else.
#
# The separate repo is the access boundary. A fine-grained token scopes to a
# repository, never to a tag or an asset, and every customer box holds the
# read token for `repo`. Dev bundles live in `dev_repo`, which only dev boxes
# hold a token for (`dev_token` in update.local.toml, set from the Developer
# build tab). The customer token is never sent to `dev_repo`, nor the dev
# token to `repo`.
owner = "adamafiq0108"
repo = "irivai-release"
dev_repo = "irivai-release-dev"

[signing]
# The OTA signing public key (ed25519, raw, base64). A DIFFERENT key from the
# store's: an update replaces the code that verifies everything else, so it
# gets its own key with its own blast radius. Empty here means the built-in
# default in core/services/update.py is used.
pubkey = "TjgmysV+4XU8VRGl7UqzQNaE7azT6dvuiqF7MLIUcLE="

[check]
# Hours between background checks. The check is one small HTTPS GET, sent with
# the previous ETag, so a box that is already up to date spends almost nothing
# -- neither bandwidth nor GitHub rate limit.
interval_hours = 6

[source]
# Where the developer box PUBLISHES the built-in templates. config/formats.toml
# is a tracked file -- what the folder "Built-in templates" on the developer
# hub snapshots is committed to this branch, and the next customer release,
# built from it, carries exactly those templates to every box that updates.
# The write token lives in config/source_publish.local.toml, never here.
owner = "adamafiq0108"
repo = "irivai-systor"
branch = "cytron-dashboard"
path = "config/formats.toml"

[templates]
# Where every box CHECKS for template updates between releases -- the create
# wizard's "Check for template updates" button reads this file and installs
# the templates that are new or changed, without touching any system already
# created. The source repo above is the product's own and a customer box holds
# no token for it; the release repo is the one every box already reads with
# its update token, so "Publish templates" drops the same formats.toml here
# too. Read only from a box; the developer hub is the only writer.
owner = "adamafiq0108"
repo = "irivai-release"
branch = "main"
path = "templates/formats.toml"
