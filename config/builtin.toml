# Built-in content -- what ships ON the appliance, free, ready to use.
#
# Templates are built-in: bundled by scripts/install.sh and usable the moment
# the box boots -- pick one, or start from a blank canvas. No install step.
#
# `systems` lists the system PACKAGES that get copied into the install. The
# installer copies exactly these, rather than everything found under systems/:
# a working checkout can accumulate half-built packages, and none of them
# should reach a customer box just for having been in the folder at install
# time.
#
# Slugs must match the folder name under systems/. A slug listed here but
# missing from the checkout is an error the installer reports rather than a
# system that silently does not exist.

systems = ["demo"]

# Formats (the "start a new system from this" list) ship in code and in the
# committed config/formats.toml, so they need no listing here -- they travel
# with the product by definition. This file only decides which whole SYSTEM
# packages are bundled.
